<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Forgot Password</title>

    <!-- =====================================================
         ABHISHEK CHANGE
         Purpose:
         Use main project styling
         ===================================================== -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<div class="auth-container">

    <h2>Forgot Password</h2>

    <!-- =====================================================
         ABHISHEK CHANGE
         Purpose:
         Display error messages
         ===================================================== -->

    {% if error %}
    <div class="alert-error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <input
            type="text"
            name="fav_place"
            placeholder="Favourite Place"
            required>

        <input
            type="password"
            name="password"
            placeholder="New Password"
            required>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            required>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <br>

    <a href="/login">
        Back to Login
    </a>

</div>

</body>
</html>
